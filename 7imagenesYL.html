<!DOCTYPE html> <!--Indica que el tipo de documento es HTML -->
<html lang="en"> <!--Indica que el idioma de la pagina es "español" -->

<head> <!-- Dentro de este hay informacion y datos que no se ven directamente -->
    <meta charset="UTF-8"> <!--Este es para reconocer caracteres especiales como los acentos, la letra ñ, etc. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Le dice al navegador como mostrar la pagina en pantallas pequeñas para que sea adaptable-->
    <title>Imagenes en HTML</title> <!-- Define el titulo de la pagina -->
</head> <!-- cierre del head -->
<body> <!--Cuerpo de la pagina web, todo lo que estara dentro de esta -->
    <h2>Imagenes en HTML</h2> <!-- Titulo o subtitulo dependiendo su importancia -->
    <h3>Locales</h3> <!-- Subtitulo con un poco menos de importancia -->
    <img src="caritas.png" alt="Imagen de carita feliz"> <!--Inserta y muestra una imagen -->
    <h3>Locales redismensionado</h3> <!-- Subtitulo con un poco menos de importancia -->
    <img src="imagenes/carita.png" alt="" width="200" height="100"> <!--Inserta y muestra una imagen ajustando las dimensiones de largo y ancho de la pagina web-->
    <h3>Desde internet</h3> <!-- Subtitulo con un poco menos de importancia -->
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200"
    alt=""> <!--Inserta y muestra una imagen desde un servidor externo ajustando sus dimensiones-->
    <h3>Animaciones</h3> <!-- Subtitulo con un poco menos de importancia -->
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200"
    alt=""> <!--Inserta y muestra una imagen animada GIF fijando su tamaño de 200 por 200 pixeles-->
</body> <!-- Cierre del cuerpo -->

</html> <!-- Cierre de la pagina -->
